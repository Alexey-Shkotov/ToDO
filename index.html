<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TOP BAR -->
    <header class="top-bar">
        <div class="top-left">
            <div class="clock-wrap">
                <div class="clock" id="clock">00:00:00</div>
                <button class="clock-toggle" id="clockToggle" title="Сменить стиль">◐</button>
            </div>
            <div class="greeting" id="greeting"></div>
        </div>
        <div class="top-right">
            <button class="icon-btn" id="fullscreenBtn" title="Полный экран">⛶</button>
            <button class="icon-btn" id="settingsBtn" title="Настройки">⚙</button>
        </div>
    </header>

    <!-- MAIN LAYOUT -->
    <div class="app-body">

        <!-- LEFT: CALENDAR (2/3) -->
        <section class="cal-panel">
            <div class="cal-nav">
                <button class="cal-nav-btn" id="calPrev">‹</button>
                <h2 class="cal-title" id="calTitle"></h2>
                <button class="cal-nav-btn" id="calNext">›</button>
            </div>
            <div class="cal-grid-wrap">
                <div class="cal-grid" id="calGrid"></div>
            </div>
        </section>

        <!-- RIGHT: TODAY (1/3) -->
        <section class="today-panel">
            <div class="today-header">
                <div>
                    <h2 class="today-title">Сегодня</h2>
                    <div class="today-date" id="todayDate"></div>
                </div>
                <span class="today-count" id="todayCount"></span>
            </div>
            <div class="today-tasks" id="todayTasks"></div>
            <button class="add-today-btn" id="addTodayBtn">
                <span class="add-today-icon">+</span> Добавить задачу
            </button>
        </section>
    </div>

    <!-- XP BAR BOTTOM -->
    <div class="xp-bottom">
        <div class="xp-meta">
            <span class="xp-level-label">Уровень <span id="xpLevel">1</span></span>
            <span class="xp-numbers" id="xpNumbers">0 / 100 XP</span>
        </div>
        <div class="xp-track" id="xpTrack">
            <div class="xp-fill" id="xpFill"></div>
        </div>
    </div>

    <!-- ADD/EDIT TASK MODAL -->
    <div class="overlay" id="taskModal" hidden>
        <div class="modal task-modal">
            <div class="modal-header">
                <span class="modal-title" id="taskModalTitle">Новая задача</span>
                <button class="modal-close" id="closeTaskModal">✕</button>
            </div>
            <div class="modal-body">
                <input class="modal-input" type="text" id="taskTitleInput" placeholder="Название задачи..." maxlength="120" autocomplete="off" />
                <textarea class="modal-textarea" id="taskNotesInput" placeholder="Заметки (необязательно)..." rows="2" maxlength="400"></textarea>
                <div class="modal-row">
                    <div class="modal-field">
                        <label class="modal-label">Дата</label>
                        <input class="modal-input" type="date" id="taskDateInput" />
                    </div>
                    <div class="modal-field">
                        <label class="modal-label">Приоритет / XP</label>
                        <select class="modal-select" id="taskPriorityInput">
                            <option value="low">Низкий — 25 XP</option>
                            <option value="medium" selected>Средний — 50 XP</option>
                            <option value="high">Высокий — 100 XP</option>
                        </select>
                    </div>
                </div>
                <button class="modal-submit" id="saveTaskBtn">Добавить</button>
            </div>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div class="overlay" id="settingsModal" hidden>
        <div class="modal settings-modal">
            <div class="modal-header">
                <span class="modal-title">Настройки</span>
                <button class="modal-close" id="closeSettings">✕</button>
            </div>
            <div class="modal-body">
                <div class="settings-section">
                    <div class="settings-label">Как вас называть?</div>
                    <div class="settings-hint">Несколько имён чередуются случайно в приветствиях</div>
                    <div class="names-list" id="namesList"></div>
                    <div class="add-name-row">
                        <input class="modal-input" type="text" id="newNameInput" placeholder="Добавить имя или прозвище..." maxlength="32" autocomplete="off" />
                        <button class="add-name-btn" id="addNameBtn">+</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- LEVEL UP MODAL -->
    <div class="overlay" id="levelUpModal" hidden>
        <div class="modal level-modal">
            <div class="modal-body level-modal-body">
                <div class="level-up-star">✦</div>
                <div class="level-up-label">Новый уровень</div>
                <div class="level-up-num" id="luNum">2</div>
                <div class="level-up-flavor" id="luFlavor"></div>
                <button class="modal-submit" id="luClose">Продолжить</button>
            </div>
        </div>
    </div>

    <!-- PARTICLE CANVAS -->
    <canvas id="particleCanvas"></canvas>

    <script src="app.js"></script>
</body>
</html>
